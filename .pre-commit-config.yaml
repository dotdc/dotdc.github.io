# Doc: https://prek.j178.dev/configuration/

repos:
  - repo: builtin
    hooks:
    - id: check-yaml
    - id: check-added-large-files
      args:
      - "--maxkb=1100"
    - id: check-merge-conflict
    - id: mixed-line-ending
    - id: trailing-whitespace

  # Typos
  - repo: https://github.com/crate-ci/typos
    rev: 4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0
    hooks:
      - id: typos
        exclude: "themes/"

  # Markdown linter
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: cbcdc463be5464e25e3e955a511599a67b9b987f # v0.50.0
    hooks:
    - id: markdownlint
      args:
      - "--disable=MD013"
      exclude: |
        (?x)^(
            content/projects.md|
            content/resume.md
        )$

  # Zizmor
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # v1.31.1
    hooks:
      - id: zizmor
        args: [--no-progress, --fix]
