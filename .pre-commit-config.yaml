# Doc: https://prek.j178.dev/configuration/

repos:
  - repo: builtin
    hooks:
    - id: check-yaml
    - id: check-added-large-files
      args:
      - "--maxkb=1100"
    - id: check-merge-conflict
    - id: mixed-line-ending
    - id: trailing-whitespace

  # Typos
  - repo: https://github.com/crate-ci/typos
    rev: 276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
    hooks:
      - id: typos
        exclude: "themes/"

  # Markdown linter
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: bf6d1792b8bc7f6cc93f10cc27735a4cb0c38e47 # v0.50.1
    hooks:
    - id: markdownlint
      args:
      - "--disable=MD013"
      exclude: |
        (?x)^(
            content/projects.md|
            content/resume.md
        )$

  # Zizmor
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c7d31dc612dffdd4d3b2f2b88b9660d3ab057ee8 # v1.33.1
    hooks:
      - id: zizmor
        args: [--no-progress, --fix]
