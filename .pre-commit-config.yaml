# Doc: https://prek.j178.dev/configuration/

repos:
  - repo: builtin
    hooks:
    - id: check-yaml
    - id: check-added-large-files
      args:
      - "--maxkb=1100"
    - id: check-merge-conflict
    - id: mixed-line-ending
    - id: trailing-whitespace

  # Typos
  - repo: https://github.com/crate-ci/typos
    rev: 276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
    hooks:
      - id: typos
        exclude: "themes/"

  # Markdown linter
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: cbcdc463be5464e25e3e955a511599a67b9b987f # v0.50.0
    hooks:
    - id: markdownlint
      args:
      - "--disable=MD013"
      exclude: |
        (?x)^(
            content/projects.md|
            content/resume.md
        )$

  # Zizmor
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # v1.32.0
    hooks:
      - id: zizmor
        args: [--no-progress, --fix]
