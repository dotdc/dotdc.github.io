      url: "/about"
      weight: 1
    - identifier: "blog"
      name: "blog"
      title: "My blog"
      url: "/blog"
      weight: 5
    - identifier: "projects"
      name: "projects"
      title: "My projects"
      url: "/projects"
      weight: 10
    - identifier: "resume"
      name: "resume"
      title: "My resume"
      url: "/resume"
      weight: 15

markup:
