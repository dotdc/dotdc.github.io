# Hugo configuration file

baseurl: "https://0xdc.me/"
# baseurl: "http://localhost:1313/"
languageCode: "en-us"
title: "0xDC.me"
theme: "0xDC"

pagination:
  pagerSize: 5

params:
  author: "David Calvert"
  twitter: "0xDC_"
  largeTwitterCard: true
  description: "My Blog"
  enforceDarkMode: true
  enableSearch: false
  showReadTime: false
  authorbox:
    enabled: true
    bio: "I'm David, an engineer working remotely from the south of France, leading a team of engineers while staying hands-on. On this blog, I write about engineering leadership, infrastructure, observability, security and more. Away from the keyboard, I enjoy rock climbing, reading, listening to music and replaying old adventure games."
    social:
      - name: "GitHub"
        icon: "github"
        url: "https://github.com/dotdc"
      - name: "LinkedIn"
        icon: "linkedin"
        url: "https://www.linkedin.com/in/0xDC"
      - name: "Bluesky"
        icon: "bluesky"
        url: "https://bsky.app/profile/0xdc.me"
      - name: "X"
        icon: "x-logo"
        url: "https://x.com/0xDC_"

