# Hugo configuration file

baseurl: "https://0xdc.me/"
# baseurl: "http://localhost:1313/"
languageCode: "en-us"
title: "0xDC.me"
theme: "0xDC"

pagination:
  pagerSize: 5

params:
  author: "David Calvert"
  twitter: "0xDC_"
  largeTwitterCard: true
  description: "My Blog"
  enforceDarkMode: true
  enableSearch: false
  showReadTime: false
  authorbox:
    enabled: true
    name: "David Calvert"
    title: "Senior Staff Engineer - Technical Lead"
