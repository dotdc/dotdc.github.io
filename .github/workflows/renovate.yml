---
name: renovate

# Doc: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

on:
  # Run every day at 04:00 UTC
  schedule:
    - cron: "0 4 * * *"
  # Allow this workflow to be manually triggered
  workflow_dispatch:

# No permissions by default
permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # Doc: https://github.com/renovatebot/github-action
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
