---
name: deploy-hugo

# Doc: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

on:
  push:
    branches:
      - main
  # Allow this workflow to be manually triggered
  workflow_dispatch:

# No permissions by default
permissions: {}

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job, shared with the PR check
  build:
    permissions:
      contents: read
    uses: $/.github/workflows/build-hugo.yml
    with:
      upload-pages-artifact: true

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: "https://0xdc.me/"
    runs-on: ubuntu-latest
    needs: build
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
