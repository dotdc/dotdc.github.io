---
name: build-hugo

# Doc: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

on:
  # Check that the site builds on every push to a PR targeting main
  pull_request:
    branches:
      - main
  # Reused by deploy-hugo.yml
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Upload ./public as the GitHub Pages artifact
        type: boolean
        default: false
  # Allow this workflow to be manually triggered
  workflow_dispatch:

# No permissions by default
permissions: {}

# Cancel outdated builds of the same PR
concurrency:
  group: build-hugo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Doc: https://github.com/gohugoio/hugo/releases
      # renovate: datasource=github-releases depName=gohugoio/hugo extractVersion=^v(?<version>.+)$
      HUGO_VERSION: 0.170.0
      # Doc: https://github.com/sass/dart-sass/releases
      # renovate: datasource=github-releases depName=sass/dart-sass
      DART_SASS_VERSION: 1.108.2
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: ${{ env.HUGO_VERSION }}

      # Hugo >= 0.170.0 dropped LibSass, css.Sass requires Dart Sass in $PATH
      - name: Setup Dart Sass
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/dart-sass.tar.gz" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -xzf "${RUNNER_TEMP}/dart-sass.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/dart-sass/sass" --version

      - name: Build Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --minify \
            --baseURL "https://0xdc.me/"

      - name: Upload artifact
        if: ${{ inputs.upload-pages-artifact }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public
